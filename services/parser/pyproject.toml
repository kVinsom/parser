[project]
name = "vpars-parser"
version = "0.1.0"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".generated"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
